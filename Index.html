<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbsensiQue - Sistem Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/tracking-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tracking.js/1.1.3/data/face-min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-in-left { animation: slideInLeft 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

<body class="bg-slate-100 text-slate-800 antialiased overflow-x-hidden selection:bg-blue-200">

    <div id="app" class="min-h-screen relative w-full md:max-w-5xl lg:max-w-7xl mx-auto bg-slate-50 md:shadow-2xl overflow-hidden flex flex-col">
    </div>
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

    <script>
        const DB_URL = "https://script.google.com/macros/s/AKfycbyIdKtN6gcFI0FLC10olukT5fuSTnpusKbDPtC_ENVTcX0y_M2LS3HTWtsp6VZUw0_DTA/exec"; 
        
        let currentTab = 'dashboard';
        
        window.appState = {
            currentUser: null,
            employees: [{ id: 'ADMIN', name: 'Administrator', position: 'Admin Utama', password: 'admin', role: 'admin', isDeleted: false }],
            attendances: [],
            leaves: [],
            schedules: [],
            shifts: [],
            settings: { companyName: 'AbsensiQue' }
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-emerald-500' : (type === 'error' ? 'bg-rose-500' : (type === 'warning' ? 'bg-amber-500' : 'bg-blue-500'));
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 slide-up pointer-events-auto`;
            
            let svgIcon = '';
            if(type === 'success') svgIcon = `<svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            else if(type === 'error') svgIcon = `<svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
            else svgIcon = `<svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;

            toast.innerHTML = `${svgIcon} <span class="font-medium text-sm leading-tight">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0'; toast.style.transform = 'translateY(-20px)'; toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.showConfirmModal = function(title, message, onConfirm, onCancel = null) {
            let modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-900/80 z-[120] flex items-center justify-center p-4 fade-in backdrop-blur-sm';
            modal.innerHTML = `
                <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl slide-up text-center border border-slate-100">
                    <div class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm border-4 border-white"><i data-lucide="alert-circle" class="w-8 h-8"></i></div>
                    <h3 class="font-bold text-lg text-slate-800 mb-2">${title}</h3>
                    <p class="text-sm text-slate-500 mb-6">${message}</p>
                    <div class="flex gap-3">
                        <button id="btn-modal-cancel" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3.5 rounded-xl hover:bg-slate-200 text-sm transition">Batal</button>
                        <button id="btn-modal-confirm" class="flex-1 bg-amber-500 text-white font-bold py-3.5 rounded-xl hover:bg-amber-600 shadow-lg shadow-amber-200 text-sm transition">Lanjutkan</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons();

            document.getElementById('btn-modal-cancel').onclick = () => { modal.remove(); if(onCancel) onCancel(); };
            document.getElementById('btn-modal-confirm').onclick = () => { modal.remove(); if(onConfirm) onConfirm(); };
        };

        window.hitungLembur = function(clockIn, clockOut, shiftStart, shiftEnd) {
            if (!clockOut || clockOut === '-' || clockOut === '--:--' || !shiftEnd || shiftEnd === '-' || shiftEnd === '--:--') return 0;
            try {
                let outTime = String(clockOut).trim().replace('.', ':');
                let sEndTime = String(shiftEnd).trim().replace('.', ':');
                
                let outParts = outTime.split(':');
                let seParts = sEndTime.split(':');
                
                let outMins = parseInt(outParts[0]||0) * 60 + parseInt(outParts[1]||0);
                let seMins = parseInt(seParts[0]||0) * 60 + parseInt(seParts[1]||0);
                
                if (seMins < 12 * 60 && outMins > 12 * 60) {
                    seMins += 24 * 60;
                }
                if (outMins < 12 * 60 && seMins > 12 * 60) {
                    outMins += 24 * 60;
                }

                if (outMins > seMins) {
                    return outMins - seMins; 
                }
                
                return 0; 
            } catch(e) { return 0; }
        };

        window.formatDateStandard = function(dateInput) {
            if(!dateInput) return "";
            
            if (dateInput instanceof Date) {
                if(isNaN(dateInput.getTime())) return "";
                let dYear = dateInput.getFullYear();
                let dMonth = String(dateInput.getMonth() + 1).padStart(2, '0');
                let dDay = String(dateInput.getDate()).padStart(2, '0');
                return `${dYear}-${dMonth}-${dDay}`;
            }

            let str = String(dateInput).trim().replace(/'/g, ''); 
            
            if (str.includes('T') && str.endsWith('Z')) {
                let d = new Date(str);
                if(!isNaN(d.getTime())) {
                    let dYear = d.getFullYear();
                    let dMonth = String(d.getMonth() + 1).padStart(2, '0');
                    let dDay = String(d.getDate()).padStart(2, '0');
                    return `${dYear}-${dMonth}-${dDay}`;
                }
            }
            
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes(' ')) str = str.split(' ')[0];
            
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
            
            if(str.includes('/')) {
                let parts = str.split('/');
                if(parts.length === 3) {
                    if(parts[2].length === 4) { 
                        let p0 = parseInt(parts[0]);
                        if(p0 > 12) { 
                            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                        } else { 
                            return `${parts[2]}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
                        }
                    } else if (parts[0].length === 4) { 
                        return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                    }
                }
            }
            
            let d = new Date(str);
            if(!isNaN(d.getTime())) {
                let dYear = d.getFullYear();
                let dMonth = String(d.getMonth() + 1).padStart(2, '0');
                let dDay = String(d.getDate()).padStart(2, '0');
                return `${dYear}-${dMonth}-${dDay}`;
            }
            
            return str;
        };

        window.syncData = async function(isManual = false) {
            if (!DB_URL.startsWith("http")) return;
            let btnSync = document.getElementById('btn-sync');
            if(btnSync) btnSync.classList.add('animate-spin');

            try {
                const urlFetch = DB_URL + '?action=get_data&nocache=' + new Date().getTime();
                const response = await fetch(urlFetch);
                const textResponse = await response.text();
                let cloudData;
                
                try {
                    cloudData = JSON.parse(textResponse);
                } catch (e) {
                    throw new Error("Data bukan format JSON. Deployment salah.");
                }
                
                if(cloudData.error) throw new Error(cloudData.error);
                
                let db = cloudData.data ? cloudData.data : cloudData;
                
                const lowerKeys = (obj) => {
                    let res = {};
                    for(let k in obj) { 
                        if(k) {
                            let cleanKey = String(k).toLowerCase().trim();
                            res[cleanKey] = obj[k]; 
                            res[cleanKey.replace(/\s+/g, '_')] = obj[k]; 
                            res[cleanKey.replace(/\s+/g, '')] = obj[k]; 
                        } 
                    }
                    return res;
                };

                const parseTime = (val) => {
                    if (!val || val === '-' || val === '--:--') return '--:--';
                    let str = String(val).trim();
                    if (str.includes('T') && str.endsWith('Z')) {
                        let d = new Date(str);
                        if (!isNaN(d.getTime())) {
                            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                        }
                    }
                    return str.replace(/\./g, ':');
                };

                if (db.employees !== undefined) {
                    let empList = Array.isArray(db.employees) ? db.employees : [];
                    window.appState.employees = empList.map(raw => {
                        let e = lowerKeys(raw);
                        return {
                            id: String(e.id || e.id_user || e.iduser || '').trim(),
                            name: e.name || e.nama || e.nama_lengkap || e.namalengkap || 'Tanpa Nama',
                            position: e.position || e.jabatan || 'Staff',
                            username: e.username || e.user || '',
                            password: e.password || e.pin || e.sandi || '',
                            role: String(e.role || e.peran || 'staff').toLowerCase(),
                            isDeleted: e.isdeleted || e.is_deleted || false
                        };
                    }).filter(e => e.id !== ''); 
                    
                    if(!window.appState.employees.find(e => String(e.id).toUpperCase() === 'ADMIN')) {
                        window.appState.employees.push({ id: 'ADMIN', name: 'Administrator', username: 'admin', position: 'Admin Utama', password: 'admin', role: 'admin', isDeleted: false });
                    }
                }
                
                if (db.settings) window.appState.settings = { ...window.appState.settings, ...db.settings };
                
                if (db.leaves !== undefined) {
                    let lvList = Array.isArray(db.leaves) ? db.leaves : [];
                    window.appState.leaves = lvList.map(raw => {
                        let l = lowerKeys(raw);
                        let rawDate = l.date || l.tanggal || '';
                        let rawEmpId = l.empid || l.id_user || l.iduser || '';
                        return {
                            ...l, 
                            date: window.formatDateStandard(rawDate), 
                            empId: String(rawEmpId).trim().toUpperCase(),
                            type: l.type || l.jenis || l.jenis_izin || l.jenisizin || '',
                            reason: l.reason || l.keterangan || l.alasan || '',
                            status: l.status || 'Pending'
                        };
                    });
                }
                
                if (db.shifts !== undefined) {
                    let shList = Array.isArray(db.shifts) ? db.shifts : [];
                    window.appState.shifts = shList.map(raw => {
                        let s = lowerKeys(raw);
                        return {
                            id: String(s.id_shift || s.shift || s.idshift || s.id || '').trim().toUpperCase(),
                            name: s.nama_shift || s.namashift || s.nama || s.name || '',
                            startTime: parseTime(s.jam_masuk || s.jammasuk || s.start || s.starttime || s.masuk || ''),
                            endTime: parseTime(s.jam_pulang || s.jampulang || s.end || s.endtime || s.pulang || '')
                        };
                    });
                }
                
                if (db.schedules !== undefined) {
                    let scList = Array.isArray(db.schedules) ? db.schedules : [];
                    window.appState.schedules = scList.map(raw => {
                        let s = lowerKeys(raw);
                        let rawDate = s.date || s.tanggal || '';
                        let rawEmpId = s.id_user || s.iduser || s.empid || s.user || s.id || '';
                        let rawShiftId = s.id_shift || s.idshift || s.shiftid || s.shift || '';
                        return { 
                            id: String(s.id || s.id_jadwal || s.idjadwal || '').trim(),
                            date: window.formatDateStandard(rawDate), 
                            empId: String(rawEmpId).trim().toUpperCase(), 
                            shiftId: String(rawShiftId).trim().toUpperCase() 
                        };
                    });
                }
                
                if (db.attendances !== undefined) {
                    let attList = Array.isArray(db.attendances) ? db.attendances : [];
                    window.appState.attendances = attList.map(raw => {
                        let a = lowerKeys(raw);
                        let rawDate = a.date || a.tanggal || '';
                        let rawEmpId = a.empid || a.id_user || a.iduser || '';
                        let rIn = parseTime(a.clockin || a.jam_masuk || a.jammasuk || '--:--');
                        let rOut = parseTime(a.clockout || a.jam_pulang || a.jampulang || '--:--');
                        let rPhotoIn = a.photoin || a.foto_masuk || a.fotomasuk || a.foto || '-';
                        let rPhotoOut = a.photoout || a.foto_pulang || a.fotopulang || '-';
                        
                        return { 
                            id: String(a.id || a.id_absensi || a.idabsensi || '').trim(),
                            date: window.formatDateStandard(rawDate), 
                            empId: String(rawEmpId).trim().toUpperCase(),
                            clockIn: rIn,
                            clockOut: rOut,
                            status: a.status || 'Hadir',
                            photoIn: rPhotoIn,
                            photoOut: rPhotoOut
                        };
                    });
                }
                
                window.renderApp();
                
                if (document.getElementById('kalender-grid') && typeof window.updateIsiKalender === 'function') {
                    window.updateIsiKalender();
                }
                
                if(isManual) window.showToast('Data berhasil ditarik!', 'success');
                
            } catch(e) { 
                console.warn("Detail Error Sync:", e);
                let msg = e.message;
                
                // Peringatan ini tidak akan muncul lagi jika setting Deploy "Siapa saja" (Anyone) sudah diterapkan!
                if(msg.includes('NetworkError') || msg.includes('Failed to fetch') || msg.includes('CORS') || msg.includes('Data bukan format JSON')) {
                    let modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-slate-900/90 z-[150] flex items-center justify-center p-4 fade-in backdrop-blur-sm';
                    modal.innerHTML = `
                        <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl slide-up text-left border border-slate-100 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-2 bg-rose-500"></div>
                            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-rose-200 shadow-inner">
                                <i data-lucide="shield-alert" class="w-8 h-8"></i>
                            </div>
                            <h3 class="font-black text-xl text-slate-800 mb-2 text-center tracking-tight">Koneksi Diblokir Google</h3>
                            <p class="text-sm text-slate-600 mb-5 text-center leading-relaxed">Script Anda <b>sudah benar dan bekerja</b>, tetapi Google memblokir aplikasi ini karena Anda salah memilih pengaturan saat Deploy di Apps Script.</p>
                            
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 mb-6 shadow-sm">
                                <p class="text-[11px] font-black text-slate-400 uppercase tracking-wider mb-3">Cara Mengatasinya (Wajib 100%):</p>
                                <ol class="text-[13px] text-slate-700 space-y-3 list-decimal pl-4 font-medium">
                                    <li>Buka <span class="font-bold">Google Apps Script</span> Anda.</li>
                                    <li>Klik tombol biru <span class="font-bold">Terapkan (Deploy)</span> -> <span class="font-bold">Kelola Penerapan</span>.</li>
                                    <li>Klik tombol <span class="font-bold">Pensil (Edit)</span> di sebelah kanan atas.</li>
                                    <li class="bg-emerald-50 p-2 rounded-lg border border-emerald-100 shadow-sm"><span class="text-emerald-800 font-bold">UBAH PENGATURAN INI (SANGAT PENTING):</span><br>Bagian "Siapa saja yang memiliki akses", <b>JANGAN</b> pilih Akun Google. <b>WAJIB PILIH PALING BAWAH: <span class="font-black text-emerald-700">"Siapa Saja" (Anyone)</span></b>.</li>
                                    <li>Bagian Versi <b>WAJIB</b> pilih: <span class="font-bold">Baru (New)</span>.</li>
                                    <li>Klik tombol <b>Terapkan</b> lalu Refresh halaman ini.</li>
                                </ol>
                            </div>
                            <button onclick="this.closest('.fixed').remove()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl hover:bg-black transition shadow-lg active:scale-95">Saya Mengerti & Akan Perbaiki</button>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    if(window.lucide) lucide.createIcons();
                } else {
                    if(isManual) window.showToast(msg, "error");
                }
            } finally {
                if(btnSync) btnSync.classList.remove('animate-spin');
            }
        };

        window.renderApp = function() {
            const appDiv = document.getElementById('app');
            
            if (!window.appState.currentUser) {
                if (!document.getElementById('pin-input')) {
                    appDiv.innerHTML = ''; 
                    renderLogin(appDiv);
                    if(window.lucide) lucide.createIcons(); 
                }
                return; 
            }

            appDiv.innerHTML = ''; 

            const contentDiv = document.createElement('div');
            contentDiv.id = 'main-content';
            contentDiv.className = 'h-screen overflow-y-auto pb-20 no-scrollbar';
            appDiv.appendChild(contentDiv);

            if(currentTab === 'dashboard') renderDashboard(contentDiv);
            else if(currentTab === 'rekap') renderRekap(contentDiv);
            else if(currentTab === 'karyawan') renderKaryawan(contentDiv);
            else if(currentTab === 'akun') renderAkun(contentDiv);

            renderBottomNav(appDiv);
            
            if(window.lucide) lucide.createIcons();
        };

        window.navigate = function(tab) {
            currentTab = tab;
            window.renderApp();
        };

        function renderLogin(container) {
            const bgImage = "https://images.unsplash.com/photo-1534723452862-4c874018d66d?auto=format&fit=crop&q=80&w=1000"; 
            container.innerHTML = `
                <div class="h-screen w-full relative flex items-center justify-center p-6 bg-slate-900">
                    <div class="absolute inset-0 z-0">
                        <div class="absolute inset-0 bg-slate-900/60 z-10 mix-blend-multiply backdrop-blur-[3px]"></div>
                        <img src="${bgImage}" alt="Background" class="w-full h-full object-cover opacity-80" />
                    </div>
                    <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 relative z-20 shadow-2xl fade-in flex flex-col items-center border border-white/20">
                        <div class="w-24 h-24 mb-6 rounded-[2rem] bg-gradient-to-br from-blue-500 to-blue-700 p-1 shadow-[0_8px_30px_rgba(37,99,235,0.6)] flex items-center justify-center relative">
                            <div class="w-full h-full bg-white rounded-[1.8rem] flex items-center justify-center z-10 relative overflow-hidden"><i data-lucide="fingerprint" class="w-14 h-14 text-blue-600"></i></div>
                            <div class="absolute -bottom-2 -right-2 bg-gradient-to-r from-orange-400 to-amber-500 w-10 h-10 rounded-full flex items-center justify-center z-20 shadow-lg border-2 border-white"><i data-lucide="clock" class="w-5 h-5 text-white"></i></div>
                        </div>
                        <div class="text-center mb-10">
                            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-2 drop-shadow-md">${window.appState.settings.companyName}</h1>
                            <p class="text-blue-100 text-xs font-medium tracking-wider uppercase border-t border-white/20 pt-2 inline-block">Sistem Absensi Terpadu</p>
                        </div>
                        <div class="w-full space-y-5">
                            <div>
                                <label class="text-[10px] font-bold text-blue-100 uppercase tracking-widest mb-2 block ml-2">PIN / Username Masuk</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i data-lucide="lock" class="w-5 h-5 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i></div>
                                    <input type="password" id="pin-input" class="w-full pl-12 pr-4 py-4 bg-white/95 border-2 border-transparent rounded-2xl text-slate-800 font-bold tracking-widest focus:border-blue-400 focus:ring-4 focus:ring-blue-400/20 transition-all outline-none text-center text-lg shadow-inner" placeholder="••••" onkeypress="if(event.key === 'Enter') window.loginApp()">
                                </div>
                            </div>
                            <button onclick="window.loginApp()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-2xl shadow-[0_8px_20px_rgba(37,99,235,0.4)] transition-all active:scale-95 flex items-center justify-center gap-2">MASUK <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.loginApp = function() {
            let pinInput = document.getElementById('pin-input').value.trim();
            if (!pinInput) return window.showToast('Silakan masukkan PIN/Username Anda', 'error');

            let user = window.appState.employees.find(e => (!e.isDeleted) && (String(e.password).trim() === pinInput || String(e.username).trim() === pinInput));
            
            if (!user && pinInput.toLowerCase() === 'admin') {
                user = window.appState.employees.find(e => String(e.role).toLowerCase() === 'admin' || String(e.id).toUpperCase() === 'ADMIN');
                if (!user) {
                    user = { id: 'ADMIN', name: 'Administrator', username: 'admin', position: 'Admin Utama', password: 'admin', role: 'admin', isDeleted: false };
                    window.appState.employees.push(user);

            const dd = String(now.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            
            if (user.role !== 'admin') {
                let mySchedule = window.appState.schedules.find(s => 
                    String(s.empId).trim().toUpperCase() === String(user.id).trim().toUpperCase() && 
                    window.formatDateStandard(s.date) === todayStr
                );
                
                if (!mySchedule) {
                    let modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-slate-900/80 z-[120] flex items-center justify-center p-4 fade-in backdrop-blur-sm';

        function lanjutBukaKamera(type) {
            let modal = document.createElement('div');
            modal.id = 'camera-modal';

            let accentColor = type === 'in' ? 'emerald' : 'rose';
            
            modal.innerHTML = `
                <div class="relative w-full max-w-md h-full flex flex-col">
                    <div class="p-4 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent absolute top-0 w-full z-20">
                        <h3 class="text-white font-bold flex items-center gap-2"><i data-lucide="camera" class="w-5 h-5"></i> Scanner Wajah (${type === 'in' ? 'Masuk' : 'Pulang'})</h3>
                        <button onclick="window.tutupKamera()" class="text-white p-2 bg-white/20 rounded-full hover:bg-white/40"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex-1 relative overflow-hidden bg-slate-900 flex items-center justify-center">
                        <video id="kamera-video" autoplay playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
                        <canvas id="face-canvas" class="absolute top-0 left-0 w-full h-full object-cover transform scale-x-[-1] z-10 pointer-events-none"></canvas>
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                            <div id="scan-frame" class="w-64 h-64 border-2 border-dashed border-rose-400 rounded-2xl relative transition-colors duration-300">
                                <div class="absolute top-0 left-0 w-full h-1 bg-white opacity-60 shadow-[0_0_15px_currentColor] animate-[scan_2s_ease-in-out_infinite]"></div>
                            </div>
                        </div>
                        <canvas id="kamera-canvas" class="hidden"></canvas>
                    </div>
                    <div class="p-6 pb-10 bg-black absolute bottom-0 w-full flex flex-col items-center gap-4 z-20">
                        <p id="kamera-status" class="text-rose-400 text-sm font-medium animate-pulse"><i data-lucide="scan-face" class="w-4 h-4 inline mb-1"></i> Arahkan Wajah ke Kamera...</p>
                        <button id="btn-capture" onclick="window.ambilFotoAbsen('${type}', '${accentColor}')" class="w-20 h-20 bg-white/50 rounded-full border-4 border-slate-500 flex items-center justify-center transition cursor-not-allowed" disabled><div class="w-16 h-16 border-2 border-slate-400 rounded-full"></div></button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons();

            let constraints = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } };
            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                window.currentStream = stream;
                let video = document.getElementById('kamera-video');
                video.srcObject = stream;
                video.onloadedmetadata = () => { 
                    video.play(); 
                    if(window.tracking) window.mulaiDeteksiWajah(); 
                    else {
                        document.getElementById('kamera-status').innerHTML = "Sistem deteksi tidak didukung. Anda bisa memotret.";

                        let btn = document.getElementById('btn-capture');
                        btn.disabled = false; btn.className = `w-20 h-20 bg-white rounded-full border-4 border-${accentColor}-300 flex items-center justify-center active:scale-90 transition shadow-[0_0_20px_rgba(255,255,255,0.3)] cursor-pointer`;

                    }
                };
            }).catch(err => {
                window.tutupKamera();
                window.showConfirmModal("Akses Kamera Gagal", "Kamera ditolak. Ingin tetap Absen tanpa foto?", () => { window.prosesAbsen(type, "-"); });
            });
        }

        window.mulaiDeteksiWajah = function() {
            let video = document.getElementById('kamera-video');
            let canvas = document.getElementById('face-canvas');
            let context = canvas.getContext('2d');
            
            let tracker = new tracking.ObjectTracker('face');
            tracker.setInitialScale(4); tracker.setStepSize(2); tracker.setEdgesDensity(0.1);

            window.trackerTask = tracking.track('#kamera-video', tracker);
            window.lastFaceDetectTime = 0;

            tracker.on('track', function(event) {
                context.clearRect(0, 0, canvas.width, canvas.height);
                let now = Date.now();
                let btn = document.getElementById('btn-capture');
                let status = document.getElementById('kamera-status');
                let frame = document.getElementById('scan-frame');

                if (event.data.length > 0) {
                    window.lastFaceDetectTime = now;
                    event.data.forEach(function(rect) {
                        context.strokeStyle = '#10b981'; context.lineWidth = 2;
                        context.strokeRect(rect.x, rect.y, rect.width, rect.height);
                    });
                }

                if (now - window.lastFaceDetectTime < 1000) {

        window.prosesAbsen = async function(type, fotoData) {
            const user = window.appState.currentUser;
            const now = new Date();
            const dateStr = window.formatDateStandard(now);
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            window.showToast("Mengirim data absensi ke Server...", "info");

            if (type === 'in') {
                window.appState.attendances.push({
                    id: 'TEMP_' + Date.now(),
                    date: dateStr,
                    empId: user.id,
                    clockIn: timeStr,
                    clockOut: '-',
                    status: 'Hadir',
                    photoIn: fotoData || '-',
                    photoOut: '-'
                });
            } else if (type === 'out') {
                let att = window.appState.attendances.find(a => String(a.empId).trim().toUpperCase() === String(user.id).trim().toUpperCase() && String(a.date).trim() === dateStr);
                if (att) {
                    att.clockOut = timeStr;
                    att.photoOut = fotoData || '-';
                }
            }
            window.renderApp();

            let dataToSend = {
                action: "absen",
                id_user: user.id, tanggal: dateStr,
                jam_masuk: type === 'in' ? timeStr : "-",
                jam_pulang: type === 'out' ? timeStr : "-",
                status: "Hadir", lokasi: "Kantor", keterangan: "Tepat Waktu",
                foto: fotoData || "-"
            };

            try {
                await fetch(DB_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dataToSend) });
                window.showToast(`Berhasil Absen ${type === 'in' ? 'Masuk' : 'Pulang'}: ${timeStr}`, "success");
                setTimeout(() => window.syncData(false), 2000); 
            } catch(e) { window.showToast("Gagal menyimpan ke server!", "error"); }
        };

        window.simpanJadwalRentang = async function(btn) {
            let empId = document.getElementById('jadwal-emp').value, shiftId = document.getElementById('jadwal-shift').value, start = document.getElementById('jadwal-start').value, end = document.getElementById('jadwal-end').value;
            if(!empId || !shiftId || !start || !end) return window.showToast('Lengkapi semua data!', 'error');
            let startDate = new Date(start), endDate = new Date(end);
            if(startDate > endDate) return window.showToast('Tanggal akhir salah!', 'error');
            
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin mx-auto"></i>'; btn.disabled = true;

            let jadwalBaruList = [];
            let loop = new Date(startDate);
            while(loop <= endDate) {
                let dateStr = `${loop.getFullYear()}-${String(loop.getMonth() + 1).padStart(2, '0')}-${String(loop.getDate()).padStart(2, '0')}`;
                
                window.appState.schedules = window.appState.schedules.filter(s => 
                    !(String(s.empId).trim().toUpperCase() === String(empId).trim().toUpperCase() && window.formatDateStandard(s.date) === dateStr)
                );
                
                jadwalBaruList.push({ 
                    id: 'SCH_' + Date.now() + Math.floor(Math.random()*1000), 
                    empId: empId, 
                    date: dateStr, 
                    shiftId: shiftId,
                    id_user: empId,
                    tanggal: dateStr,
                    id_shift: shiftId
                });
                
                loop.setDate(loop.getDate() + 1);
            }
            
            window.appState.schedules = [...window.appState.schedules, ...jadwalBaruList];
            
            let dataToSend = { action: "tambah_jadwal", jadwal_list: jadwalBaruList };
            
            try {
                fetch(DB_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dataToSend) });
                
                window.showToast('Jadwal diterapkan!', 'success');
                btn.closest('.fixed').remove();
                
                if (typeof window.updateIsiKalender === 'function') window.updateIsiKalender();
            } catch (e) {
                window.showToast("Gagal menyimpan jadwal!", "error");
                btn.innerHTML = 'Terapkan Jadwal'; 
                btn.disabled = false;
            }
        };

        window.ubahBulanKalender = function(dir) {
            let label = document.getElementById('kalender-bulan-tahun');
            let m = parseInt(label.getAttribute('data-month')), y = parseInt(label.getAttribute('data-year'));
            m += dir; if(m < 0) { m = 11; y--; } if(m > 11) { m = 0; y++; }
            label.setAttribute('data-month', m); label.setAttribute('data-year', y); window.updateIsiKalender();
        };

        window.updateIsiKalender = function() {
            let empSelect = document.getElementById('kalender-emp');
            let label = document.getElementById('kalender-bulan-tahun');
            if (!empSelect || !label) return; 

            let empId = empSelect.value.trim().toUpperCase();
            let month = parseInt(label.getAttribute('data-month')), year = parseInt(label.getAttribute('data-year'));
            let monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            label.innerText = `${monthNames[month]} ${year}`;
            let grid = document.getElementById('kalender-grid'); grid.innerHTML = '';
            
            let firstDay = new Date(year, month, 1).getDay(); let daysInMonth = new Date(year, month + 1, 0).getDate();
            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="aspect-square p-1"></div>`;
            
            for(let d=1; d<=daysInMonth; d++) {
                let loopDate = new Date(year, month, d);
                let dateStr = `${loopDate.getFullYear()}-${String(loopDate.getMonth() + 1).padStart(2, '0')}-${String(loopDate.getDate()).padStart(2, '0')}`;
                
                let mySchedule = window.appState.schedules.find(s => 
                    String(s.empId).trim().toUpperCase() === empId && 
                    window.formatDateStandard(s.date) === dateStr
                );
                
                let shiftContent = '', bgClass = 'bg-slate-50 border-slate-100';
                
                if(mySchedule) {
                    let shiftData = window.appState.shifts.find(sh => String(sh.id).trim().toUpperCase() === String(mySchedule.shiftId).trim().toUpperCase());
                    if(shiftData) { 
                        bgClass = 'bg-indigo-50 border-indigo-200 shadow-sm'; 
                        shiftContent = `<div class="text-[8px] font-bold text-indigo-600 leading-tight mt-0.5 truncate w-full px-0.5" title="${shiftData.name}">${shiftData.name}</div><div class="text-[7px] text-indigo-400 leading-tight truncate">${shiftData.startTime}</div>`; 
                    } else {
                        bgClass = 'bg-rose-50 border-rose-200'; 
                        shiftContent = `<div class="text-[7px] font-bold text-rose-500 leading-tight mt-0.5">Shift Terhapus</div>`;
                    }
                }
                grid.innerHTML += `<div class="aspect-square flex flex-col items-center justify-start pt-1 border rounded-lg ${bgClass} overflow-hidden"><span class="text-[10px] font-semibold text-slate-700">${d}</span>${shiftContent}</div>`;
            }

        window.hitungGajiOtomatis = function() {
            let empId = document.getElementById('gaji-emp').value;
            let bulanTahun = document.getElementById('gaji-bulan').value; 
            if(!empId || !bulanTahun) return;

            let atts = window.appState.attendances.filter(a => String(a.empId).trim().toUpperCase() === String(empId).trim().toUpperCase() && String(a.date).trim().startsWith(bulanTahun));
            let totalHadir = atts.filter(a => String(a.status).trim() === 'Hadir').length;
            
            let totalLemburMins = 0;
            atts.forEach(att => {
                let cleanDate = window.formatDateStandard(att.date);
                let sched = window.appState.schedules.find(s => String(s.empId).trim().toUpperCase() === String(empId).trim().toUpperCase() && window.formatDateStandard(s.date) === cleanDate);
                let sStart = null, sEnd = null;
                let isValidShift = false;
                
                if(sched) {
                    let sh = window.appState.shifts.find(s => String(s.id).trim().toUpperCase() === String(sched.shiftId).trim().toUpperCase());
                    if(sh) { sStart = String(sh.startTime).trim(); sEnd = String(sh.endTime).trim(); isValidShift = true; }
                }
                
                if (isValidShift) {
                    totalLemburMins += window.hitungLembur(att.clockIn, att.clockOut, sStart, sEnd);
                }
            });
            let jamLembur = Math.floor(totalLemburMins / 60);

            let izin = window.appState.leaves.filter(l => String(l.empId).trim().toUpperCase() === String(empId).trim().toUpperCase() && String(l.date).trim().startsWith(bulanTahun) && String(l.status).trim() === 'Disetujui').length;

            document.getElementById('gaji-hadir').value = totalHadir;
            document.getElementById('gaji-izin').value = izin;
            document.getElementById('gaji-lembur').value = jamLembur;
            
            if (parseInt(document.getElementById('gaji-pokok').value) === 0) {
                document.getElementById('gaji-pokok').value = "3000000"; 
            }
            window.updateTotalGaji();
        };

        window.updateTotalGaji = function() {
            let pokok = parseInt(document.getElementById('gaji-pokok').value) || 0;
            let lemburJam = parseInt(document.getElementById('gaji-lembur').value) || 0;
            let tarifLembur = parseInt(document.getElementById('gaji-tarif-lembur').value) || 0;
            let kasbon = parseInt(document.getElementById('gaji-kasbon').value) || 0;
            
            let total = pokok + (lemburJam * tarifLembur) - kasbon;
            document.getElementById('gaji-total').innerText = total.toLocaleString('id-ID');
        };

            let kasbon = parseInt(document.getElementById('gaji-kasbon').value) || 0;
            let total = document.getElementById('gaji-total').innerText;

            let printArea = document.createElement('div');

                <table class="w-full mb-6 border-collapse">
                    <tr class="border-b border-slate-300"><th class="text-left py-2">Keterangan</th><th class="text-right py-2">Jumlah</th></tr>
                    <tr><td class="py-2">Gaji Pokok</td><td class="text-right py-2">Rp ${pokok.toLocaleString('id-ID')}</td></tr>
                    <tr><td class="py-2">Uang Lembur (${lembur} jam)</td><td class="text-right py-2">Rp ${uLembur.toLocaleString('id-ID')}</td></tr>
                    <tr><td class="py-2 text-rose-600">Potongan Kasbon</td><td class="text-right py-2 text-rose-600">- Rp ${kasbon.toLocaleString('id-ID')}</td></tr>
                    <tr class="border-t-2 border-slate-800 font-bold text-lg"><td class="py-3">TOTAL DITERIMA</td><td class="text-right py-3">Rp ${total}</td></tr>
                </table>
                <div class="mt-12 flex justify-between text-center">
                    <div><p class="mb-16">Penerima,</p><p class="underline font-bold">${emp.name}</p></div>
                    <div><p class="mb-16">Manager HRD,</p><p class="underline font-bold">${window.appState.currentUser.name}</p></div>
                </div>
            `;
            document.body.appendChild(printArea);
            window.print();
            setTimeout(() => printArea.remove(), 1000);
        };

        window.renderKaryawan = function(container) {
            const user = window.appState.currentUser;
            if (user.role !== 'admin') { container.innerHTML = `<div class="h-full flex flex-col items-center justify-center p-8 text-center fade-in"><div class="w-24 h-24 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mb-6 border-4 border-white shadow-lg"><i data-lucide="shield-alert" class="w-12 h-12"></i></div><h2 class="text-xl font-bold text-slate-800 mb-2">Akses Ditolak</h2><p class="text-sm text-slate-500">Hanya HRD/Admin yang dapat mengakses ini.</p></div>`; return; }
            let emps = window.appState.employees.filter(e => !e.isDeleted);
            let html = `<div class="bg-blue-600 pt-8 pb-16 px-5 md:px-10 rounded-b-[2rem] md:rounded-b-[3rem] shadow-md relative z-0 flex justify-between items-center"><h2 class="text-white font-bold text-xl md:text-2xl tracking-wide">Karyawan</h2><button onclick="window.tambahKaryawan()" class="bg-white/20 hover:bg-white/30 text-white p-2 rounded-xl backdrop-blur-sm transition active:scale-95 flex items-center gap-2"><i data-lucide="user-plus" class="w-6 h-6"></i> <span class="hidden md:inline font-bold text-sm">Tambah</span></button></div><div class="px-5 md:px-10 -mt-10 relative z-10 fade-in pb-24"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">`;
            emps.forEach(e => {
                let safeName = e.name || e.nama_lengkap || e.nama || 'Tanpa Nama';
                let safePos = e.position || e.jabatan || 'Staff';
                let safeUser = e.username || e.user || '-';
                let safePin = e.password || e.pin || '';
                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-4 hover:shadow-md transition">
                        <div class="w-12 h-12 ${e.role === 'admin' ? 'bg-amber-100 text-amber-600' : 'bg-blue-100 text-blue-600'} rounded-full flex items-center justify-center font-bold text-xl flex-shrink-0">${safeName.charAt(0)}</div>
                        <div class="flex-1"><h4 class="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">${safeName} ${e.role === 'admin' ? '<i data-lucide="crown" class="w-3 h-3 md:w-4 md:h-4 text-amber-500"></i>' : ''}</h4><p class="text-xs text-slate-500 font-medium">${safePos} • <span class="font-mono bg-slate-100 px-1 rounded">${safeUser}</span></p></div>
                        <div class="flex flex-col gap-1">
                            <button onclick="window.editKaryawan('${e.id}', '${safeName}', '${safeUser}', '${safePos}', '${safePin}')" class="p-2 bg-slate-50 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition"><i data-lucide="edit" class="w-4 h-4"></i></button>
                            <button onclick="window.hapusKaryawan('${e.id}', this)" class="p-2 bg-slate-50 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
            });
            html += `</div></div>`; container.innerHTML = html;
        };

        window.hapusKaryawan = function(id, btn) {
            window.showConfirmModal("Hapus Karyawan?", "Apakah Anda yakin ingin menghapus data karyawan ini? Tindakan ini tidak dapat dibatalkan.", async () => {
                btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>'; 
                btn.disabled = true;
                
                try {
                    await fetch(DB_URL, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                        body: JSON.stringify({ action: "hapus_karyawan", id_user: id }) 
                    });
                    window.showToast("Karyawan dihapus!", "success");
                    btn.closest('.bg-white.rounded-2xl').remove();
                    setTimeout(() => window.syncData(false), 1500);
                } catch(e) { 
                    window.showToast("Gagal menghapus!", "error"); 
                    btn.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>'; 
                    btn.disabled = false;
                }
            });
        };

        window.tambahKaryawan = function() { window.tampilModalKaryawan(); };
        window.editKaryawan = function(id, name, user, pos, pin) { window.tampilModalKaryawan(id, name, user, pos, pin); };

        window.tampilModalKaryawan = function(id = '', name = '', user = '', pos = 'Staff', pin = '') {
            let modal = document.createElement('div'); modal.className = 'fixed inset-0 bg-slate-900/60 z-[70] flex items-center justify-center p-4 fade-in backdrop-blur-sm';
            let isEdit = id !== '';
            modal.innerHTML = `
                <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl slide-up text-left border border-slate-100">
                    <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="${isEdit ? 'user-cog' : 'user-plus'}" class="w-5 h-5 text-blue-600"></i> ${isEdit ? 'Edit Karyawan' : 'Tambah Karyawan'}</h3>
                    <input type="hidden" id="emp-id" value="${id}">
                    <div class="space-y-3 mb-6">
                        <div><label class="text-xs font-semibold text-slate-500 block mb-1">Nama Lengkap</label><input type="text" id="emp-name" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none focus:border-blue-500" value="${name}"></div>
                        <div><label class="text-xs font-semibold text-slate-500 block mb-1">Username Login</label><input type="text" id="emp-user" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none focus:border-blue-500" value="${user}"></div>
                        <div><label class="text-xs font-semibold text-slate-500 block mb-1">Jabatan</label><input type="text" id="emp-pos" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none focus:border-blue-500" value="${pos}"></div>
                        <div><label class="text-xs font-semibold text-slate-500 block mb-1">PIN / Password</label><input type="password" id="emp-pin" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none focus:border-blue-500 tracking-widest" value="${pin}"></div>
                    </div>
                    <div class="flex gap-3"><button onclick="this.closest('.fixed').remove()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3.5 rounded-xl hover:bg-slate-200 text-sm">Batal</button>
                    <button onclick="window.simpanKaryawanBaru(this)" class="flex-1 bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 text-sm">Simpan</button></div>
                </div>`;
            document.body.appendChild(modal); lucide.createIcons();
        };

        window.simpanKaryawanBaru = async function(btn) {
            let id = document.getElementById('emp-id').value;
            let name = document.getElementById('emp-name').value.trim();
            let username = document.getElementById('emp-user').value.trim();
            let pos = document.getElementById('emp-pos').value.trim();
            let pin = document.getElementById('emp-pin').value.trim();
            
            if(!name || !username || !pin) return window.showToast("Nama, Username, dan PIN wajib diisi!", "error");
            
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin mx-auto"></i>'; btn.disabled = true;

            let actionType = id ? "edit_karyawan" : "tambah_karyawan";
            let empIdToSend = id ? id : ('EMP_' + Date.now());
            let dataToSend = { action: actionType, id_user: empIdToSend, nama_lengkap: name, username: username, password: pin, jabatan: pos, role: "staff" };

            try {
                await fetch(DB_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dataToSend) });
                btn.closest('.fixed').remove(); window.showToast("Data sukses disimpan!", "success");
                setTimeout(() => window.syncData(false), 1500);
            } catch(e) { window.showToast("Gagal menyimpan ke server!", "error"); btn.innerHTML = 'Simpan'; btn.disabled = false; }
        };

        window.renderAkun = function(container) {
            const user = window.appState.currentUser;
            container.innerHTML = `
                <div class="bg-blue-600 pt-8 pb-16 px-5 md:px-10 rounded-b-[2rem] md:rounded-b-[3rem] shadow-md relative z-0">
                    <h2 class="text-white font-bold text-xl md:text-2xl tracking-wide">Profil Akun</h2>
                </div>
                <div class="px-5 md:px-10 -mt-10 relative z-10 fade-in pb-24">
                    <div class="md:grid md:grid-cols-3 md:gap-8">
                        <div class="md:col-span-1 bg-white rounded-2xl p-6 shadow-md text-center border border-slate-100 mb-6 md:mb-0 h-fit">
                            <div class="w-20 h-20 md:w-28 md:h-28 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold text-3xl md:text-4xl mx-auto mb-3 shadow-inner border-4 border-white">${user.name.charAt(0)}</div>
                            <h3 class="font-bold text-slate-800 text-xl md:text-2xl">${user.name}</h3>
                            <p class="text-sm md:text-base text-slate-500 font-medium">${user.position}</p>
                            <span class="inline-block mt-2 px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-bold uppercase tracking-wider">${user.role}</span>
                        </div>
                        <div class="md:col-span-2 space-y-3">
                            <button onclick="window.bukaEditProfil()" class="w-full bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 hover:bg-slate-50 transition text-slate-700">
                                <i data-lucide="user-cog" class="w-5 h-5 md:w-6 md:h-6 text-blue-500"></i><span class="font-bold text-sm md:text-base flex-1 text-left">Edit Profil & Kata Sandi</span><i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                            </button>
                            <button onclick="window.logoutApp()" class="w-full bg-rose-50 p-4 md:p-5 rounded-xl shadow-sm border border-rose-100 flex items-center gap-3 hover:bg-rose-100 transition text-rose-600">
                                <i data-lucide="log-out" class="w-5 h-5 md:w-6 md:h-6"></i><span class="font-bold text-sm md:text-base">Keluar (Log Out)</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.bukaEditProfil = function() {
            let user = window.appState.currentUser;
            let isAdmin = user.role === 'admin';
            let modal = document.createElement('div'); modal.className = 'fixed inset-0 bg-slate-900/60 z-[90] flex justify-center items-center fade-in backdrop-blur-sm p-4';
            modal.innerHTML = `
                <div class="bg-white w-full max-w-sm rounded-[2rem] p-6 shadow-2xl relative slide-up border border-slate-100">
                    <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="user-cog" class="w-5 h-5 text-blue-500"></i> Edit Profil & Sandi</h3>
                    <div class="space-y-4 mb-6">
                        <div><label class="text-xs font-semibold text-slate-500 block mb-1">Nama Lengkap</label><input type="text" id="edit-user-name" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none focus:border-blue-500" value="${user.name}"></div>
                        <div><label class="text-xs font-semibold text-slate-500 block mb-1">Kata Sandi / PIN Baru</label><input type="password" id="edit-user-pass" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none focus:border-blue-500" placeholder="Kosongkan jika tidak diubah"></div>
                        ${isAdmin ? `<div><label class="text-xs font-semibold text-slate-500 block mb-1">Nama Aplikasi / Perusahaan</label><input type="text" id="edit-company-name" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none focus:border-blue-500" value="${window.appState.settings.companyName}"></div>` : ''}
                    </div>
                    <div class="flex gap-3"><button onclick="this.closest('.fixed').remove()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3.5 rounded-xl hover:bg-slate-200 text-sm transition">Batal</button>
                    <button onclick="window.simpanEditProfil(this)" class="flex-1 bg-blue-500 text-white font-bold py-3.5 rounded-xl hover:bg-blue-600 text-sm shadow-lg shadow-blue-200 transition">Simpan</button></div>
                </div>`;
            document.body.appendChild(modal); lucide.createIcons();
        };

        window.simpanEditProfil = async function(btn) {
            let newName = document.getElementById('edit-user-name').value.trim();
            let newPass = document.getElementById('edit-user-pass').value.trim();
            let companyNameInput = document.getElementById('edit-company-name');
            let newCompanyName = companyNameInput ? companyNameInput.value.trim() : window.appState.settings.companyName;
            
            let user = window.appState.currentUser;
            
            if(!newName) return window.showToast('Nama tidak boleh kosong!', 'error');
            if(user.role === 'admin' && !newCompanyName) return window.showToast('Nama Aplikasi tidak boleh kosong!', 'error');
            
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin mx-auto"></i>'; btn.disabled = true;

            let payloadPass = newPass ? newPass : user.password;
            let dataToSend = { action: "update_profil", id_user: user.id, nama: newName, password: payloadPass, company_name: newCompanyName };

            try {
                await fetch(DB_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(dataToSend) });
                user.name = newName; user.password = payloadPass; 
                if(user.role === 'admin') window.appState.settings.companyName = newCompanyName;
                window.renderApp(); btn.closest('.fixed').remove(); 
                window.showToast('Profil & Pengaturan diperbarui!', 'success');
            } catch(e) { window.showToast("Gagal menyimpan profil!", "error"); btn.innerHTML = 'Simpan'; btn.disabled = false; }
        };

        function renderBottomNav(container) {
            const nav = document.createElement('div');
            nav.className = 'fixed bottom-0 w-full md:max-w-5xl lg:max-w-7xl bg-white border-t border-slate-100 flex justify-around md:justify-center md:gap-24 px-6 py-3 md:py-4 md:rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50 pb-5 md:pb-4 no-print'; 
            const menus = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Beranda', activeBg: 'bg-blue-600 shadow-blue-200', activeText: 'text-blue-600' },
                { id: 'rekap', icon: 'file-spreadsheet', label: 'Rekap', activeBg: 'bg-emerald-500 shadow-emerald-200', activeText: 'text-emerald-600' },
                { id: 'karyawan', icon: 'users', label: 'Karyawan', activeBg: 'bg-violet-500 shadow-violet-200', activeText: 'text-violet-600' },
                { id: 'akun', icon: 'user-circle', label: 'Akun', activeBg: 'bg-slate-700 shadow-slate-300', activeText: 'text-slate-800' }
            ];
            menus.forEach(m => {
                const isActive = currentTab === m.id;
                nav.innerHTML += `
                    <button onclick="window.navigate('${m.id}')" class="flex flex-col items-center gap-1 min-w-[60px] transition-all duration-300 ${isActive ? m.activeText + ' transform -translate-y-1' : 'text-slate-400 hover:text-slate-600'}">
                        <div class="relative p-2 ${isActive ? m.activeBg + ' text-white rounded-xl shadow-lg' : 'p-1.5'} transition-all">
                            <i data-lucide="${m.icon}" class="w-5 h-5 md:w-6 md:h-6 ${isActive ? 'stroke-[2.5px]' : 'stroke-2'}"></i>
                        </div>
                        <span class="text-[10px] font-bold tracking-wide">${m.label}</span>
                    </button>`;
            });
            container.appendChild(nav);
        }

        window.onload = function() {
            if(window.lucide) lucide.createIcons();
            window.renderApp();
            setTimeout(() => { window.syncData(false); }, 500); 
        };
    </script>
</body>
</html>
