<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AbsensiQue - Sistem Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .slide-in-left { animation: slideInLeft 0.3s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        
        /* Tema Glassmorphism untuk Login */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animasi Scanner Kamera */
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        
        /* Print Styles untuk Slip Gaji */
        @media print {
            body * { visibility: hidden; }
            #slip-gaji-print-area, #slip-gaji-print-area * { visibility: visible; }
            #slip-gaji-print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased overflow-x-hidden selection:bg-blue-200">

    <div id="app" class="min-h-screen relative w-full md:max-w-5xl lg:max-w-7xl mx-auto bg-slate-50 md:shadow-2xl overflow-hidden flex flex-col">
        <!-- Konten aplikasi dirender di sini -->
    </div>

    <!-- Container untuk Notifikasi Toast -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

    <script>
        // Ganti URL ini dengan URL Web App Google Apps Script Anda (Langkah sebelumnya)
        const DB_URL = ""; 
        
        const DB_KEY = 'absensique_v6_final'; // Key baru agar fresh
        let currentTab = 'dashboard';
        
        window.appState = {
            currentUser: null,
            employees: [
                { id: 'ADMIN', name: 'Ahmad Fauzan', position: 'Admin Utama', password: 'admin', role: 'admin', isDeleted: false }
            ],
            attendances: [],
            leaves: [],
            schedules: [],
            shifts: [
                { id: 'SH1', name: 'Pagi', startTime: '08:00', endTime: '16:00' },
                { id: 'SH2', name: 'Full Day', startTime: '08:00', endTime: '20:00' }
            ],
            overtimes: [], 
            payrolls: [],
            settings: { companyName: 'AbsensiQue' }
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = type === 'success' ? 'bg-emerald-500' : (type === 'error' ? 'bg-rose-500' : 'bg-blue-500');
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 slide-up pointer-events-auto`;
            
            let svgIcon = '';
            if(type === 'success') {
                svgIcon = `<svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            } else if(type === 'error') {
                svgIcon = `<svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
            } else {
                svgIcon = `<svg class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
            }

            toast.innerHTML = `${svgIcon} <span class="font-medium text-sm leading-tight">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        function saveState() {
            localStorage.setItem(DB_KEY, JSON.stringify(window.appState));
        }

        function loadState() {
            const saved = localStorage.getItem(DB_KEY);
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    window.appState = { ...window.appState, ...parsed };
                    
                    let adminExists = window.appState.employees.find(e => e.id === 'ADMIN');
                    if(!adminExists) {
                        window.appState.employees.push({ id: 'ADMIN', name: 'Ahmad Fauzan', position: 'Admin Utama', password: 'admin', role: 'admin', isDeleted: false });
                        saveState();
                    }
                } catch(e) { console.error("Gagal memuat memori lokal", e); }
            }
        }

        async function syncData() {
            if (!DB_URL.startsWith("http")) return;
            try {
                const response = await fetch(DB_URL);
                const cloudData = await response.json();
                
                if (cloudData && Object.keys(cloudData).length > 0) {
                    const keys = ['attendances', 'leaves', 'overtimes', 'payrolls', 'employees', 'schedules', 'shifts'];
                    keys.forEach(key => {
                        if (cloudData[key] && Array.isArray(cloudData[key])) {
                            cloudData[key].forEach(cloudItem => {
                                let localItem = window.appState[key].find(l => l.id === cloudItem.id);
                                if (!localItem) window.appState[key].push(cloudItem);
                                else Object.assign(localItem, cloudItem);
                            });
                        }
                    });
                    saveState();
                }
            } catch(e) { console.warn("Sync gagal, offline mode.", e); }
        }

        async function pushDataToServer() {
            if (!DB_URL.startsWith("http")) return;
            try {
                // MENGGUNAKAN text/plain AGAR TIDAK DIBLOKIR KEAMANAN BROWSER (CORS)
                await fetch(DB_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Bypass pemblokiran CORS secara paksa dari browser HP
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(window.appState)
                });
            } catch(e) { console.warn("Gagal simpan ke cloud, tersimpan di lokal.", e); }
        }

        window.renderApp = function() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = ''; 

            if (!window.appState.currentUser) {
                renderLogin(appDiv);
            } else {
                const contentDiv = document.createElement('div');
                contentDiv.id = 'main-content';
                contentDiv.className = 'h-screen overflow-y-auto pb-20 no-scrollbar';
                appDiv.appendChild(contentDiv);

                if(currentTab === 'dashboard') renderDashboard(contentDiv);
                else if(currentTab === 'rekap') renderRekap(contentDiv);
                else if(currentTab === 'karyawan') renderKaryawan(contentDiv);
                else if(currentTab === 'akun') renderAkun(contentDiv);

                renderBottomNav(appDiv);
            }
            if(window.lucide) lucide.createIcons();
        };

        window.navigate = function(tab) {
            currentTab = tab;
            window.renderApp();
        };

        function renderLogin(container) {
            // Gambar Background Alfamart/Retail
            const bgImage = "https://images.unsplash.com/photo-1534723452862-4c874018d66d?auto=format&fit=crop&q=80&w=1000"; 

            container.innerHTML = `
                <div class="h-screen w-full relative flex items-center justify-center p-6 bg-slate-900">
                    <div class="absolute inset-0 z-0">
                        <div class="absolute inset-0 bg-slate-900/60 z-10 mix-blend-multiply backdrop-blur-[3px]"></div>
                        <img src="${bgImage}" alt="Background Toko" class="w-full h-full object-cover opacity-80" />
                    </div>

                    <div class="glass-panel w-full max-w-sm rounded-[2.5rem] p-8 relative z-20 shadow-2xl fade-in flex flex-col items-center border border-white/20">
                        
                        <!-- Logo Sidik Jari AbsensiQue -->
                        <div class="w-24 h-24 mb-6 rounded-[2rem] bg-gradient-to-br from-blue-500 to-blue-700 p-1 shadow-[0_8px_30px_rgba(37,99,235,0.6)] flex items-center justify-center relative">
                            <div class="w-full h-full bg-white rounded-[1.8rem] flex items-center justify-center z-10 relative overflow-hidden">
                                <i data-lucide="fingerprint" class="w-14 h-14 text-blue-600"></i>
                            </div>
                            <div class="absolute -bottom-2 -right-2 bg-gradient-to-r from-orange-400 to-amber-500 w-10 h-10 rounded-full flex items-center justify-center z-20 shadow-lg border-2 border-white">
                                <i data-lucide="clock" class="w-5 h-5 text-white"></i>
                            </div>
                        </div>
                        
                        <div class="text-center mb-10">
                            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-2 drop-shadow-md">AbsensiQue</h1>
                            <p class="text-blue-100 text-xs font-medium tracking-wider uppercase border-t border-white/20 pt-2 inline-block">Sistem Absensi Terpadu</p>
                        </div>
                        
                        <div class="w-full space-y-5">
                            <div>
                                <label class="text-[10px] font-bold text-blue-100 uppercase tracking-widest mb-2 block ml-2">PIN Akses Masuk</label>
                                <div class="relative group">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i data-lucide="lock" class="w-5 h-5 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                                    </div>
                                    <input type="password" id="pin-input" class="w-full pl-12 pr-4 py-4 bg-white/95 border-2 border-transparent rounded-2xl text-slate-800 font-bold tracking-widest focus:border-blue-400 focus:ring-4 focus:ring-blue-400/20 transition-all outline-none text-center text-lg shadow-inner" placeholder="••••" onkeypress="if(event.key === 'Enter') window.loginApp()">
                                </div>
                            </div>
                            
                            <button onclick="window.loginApp()" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-2xl shadow-[0_8px_20px_rgba(37,99,235,0.4)] transition-all active:scale-95 flex items-center justify-center gap-2">
                                MASUK <i data-lucide="arrow-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.loginApp = function() {
            let pinInput = document.getElementById('pin-input').value.trim();
            if (!pinInput) return window.showToast('Silakan masukkan PIN Anda', 'error');

            if(pinInput.toLowerCase() === 'admin' || pinInput === 'Admin') pinInput = 'admin';

            let user = window.appState.employees.find(e => e.password === pinInput && !e.isDeleted);
            
            // Auto restore admin if completely lost
            if (!user && pinInput === 'admin') {
                user = { id: 'ADMIN', name: 'Ahmad Fauzan', position: 'Admin Utama', password: 'admin', role: 'admin', isDeleted: false };
                window.appState.employees.push(user);
            }

            if (user) {
                window.appState.currentUser = user;
                currentTab = 'dashboard';
                saveState();
                window.renderApp();
                window.showToast(`Selamat datang, ${user.name}!`);
            } else {
                window.showToast('PIN salah atau akun tidak ditemukan!', 'error');
            }
        };

        window.logoutApp = function() {
            window.appState.currentUser = null;
            saveState();
            window.renderApp();
            window.showToast('Anda telah keluar.');
        };

        window.renderDashboard = function(container) {
            const user = window.appState.currentUser;
            const today = new Date().toISOString().split('T')[0];
            const myAtt = window.appState.attendances.find(a => a.empId === user.id && a.date === today);
            
            const currentMonth = today.substring(0, 7);
            const myMonthAtt = window.appState.attendances.filter(a => a.empId === user.id && a.date.startsWith(currentMonth));
            const myOvertimes = window.appState.overtimes.filter(o => o.empId === user.id && o.date.startsWith(currentMonth));
            
            let countHadir = myMonthAtt.length;
            
            let totalOvertimeMins = 0;
            myOvertimes.forEach(o => totalOvertimeMins += (parseInt(o.minutes) || 0));
            let otHours = Math.floor(totalOvertimeMins / 60);
            let otMins = totalOvertimeMins % 60;

            let todayShiftName = "Belum Ada Jadwal";
            let mySchedule = window.appState.schedules.find(s => s.empId === user.id && s.date === today);
            if(mySchedule) {
                let shiftData = window.appState.shifts.find(sh => sh.id === mySchedule.shiftId);
                if(shiftData) todayShiftName = `Shift: ${shiftData.name} (${shiftData.startTime}-${shiftData.endTime})`;
            } else {
                todayShiftName = "Shift: Standar (08:00-17:00)";
            }

            // Generate Data Grafik 7 Hari Terakhir
            let chartHtml = '';
            for(let i=6; i>=0; i--) {
                let d = new Date();
                d.setDate(d.getDate() - i);
                let dateStr = d.toISOString().split('T')[0];
                let dayName = d.toLocaleDateString('id-ID', {weekday:'short'});
                
                let attData = window.appState.attendances.find(a => a.empId === user.id && a.date === dateStr);
                
                let barColor = 'bg-slate-200'; // Default/Kosong
                let barHeight = '15%';
                let iconStatus = '';
                
                if(attData) {
                    barColor = 'bg-emerald-500';
                    barHeight = '100%';
                } else if(dateStr === today) {
                    barColor = 'bg-blue-300 animate-pulse';
                    barHeight = '50%';
                }
                
                chartHtml += `
                    <div class="flex flex-col items-center flex-1 gap-2 h-full">
                        <div class="w-full bg-slate-50 rounded-lg h-full flex items-end justify-center overflow-hidden relative border border-slate-100">
                            <div class="${barColor} w-full rounded-lg transition-all duration-1000 shadow-sm" style="height: ${barHeight};"></div>
                        </div>
                        <span class="text-[9px] font-bold ${dateStr === today ? 'text-blue-600' : 'text-slate-500'} uppercase">${dayName}</span>
                    </div>
                `;
            }

            container.innerHTML = `
                <!-- Header Melengkung -->
                <div class="bg-blue-600 pt-8 pb-20 px-5 md:px-10 rounded-b-[2.5rem] md:rounded-b-[4rem] shadow-lg relative z-0">
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex items-center gap-2">
                            ${user.role === 'admin' ? 
                            `<button onclick="window.bukaAdminMenu()" class="text-white hover:bg-blue-500/50 p-2 rounded-xl transition active:scale-90"><i data-lucide="menu" class="w-7 h-7"></i></button>` 
                            : `<div class="w-7 h-7"></div>`}
                        </div>
                        <h2 class="text-white font-bold text-lg tracking-wide">AbsensiQue</h2>
                        <button class="text-white relative p-2 hover:bg-blue-500/50 rounded-xl transition active:scale-90">
                            <i data-lucide="bell" class="w-6 h-6"></i>
                            <span class="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full border border-blue-600"></span>
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-4 mt-2">
                        <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center font-bold text-2xl text-blue-600 shadow-inner border-2 border-blue-200">
                            ${user.name.charAt(0)}
                        </div>
                        <div class="text-white">
                            <p class="text-blue-100 text-sm">Selamat bekerja,</p>
                            <h3 class="font-bold text-xl">${user.name}</h3>
                            <p class="text-blue-200 text-xs font-medium">${user.position} | ${user.role.toUpperCase()}</p>
                        </div>
                    </div>
                </div>

                <!-- Kartu Status Absen Hari Ini -->
                <div class="px-5 md:px-10 -mt-12 relative z-10 fade-in">
                    <div class="md:grid md:grid-cols-12 md:gap-6">
                        
                        <!-- Kolom Kiri: Status Absen (Desktop: 5 kolom) -->
                        <div class="md:col-span-5 bg-white rounded-3xl p-5 shadow-xl border border-slate-100 mb-6 md:mb-0 flex flex-col">
                            <div class="flex justify-between items-center mb-4 border-b border-slate-50 pb-3">
                                <h4 class="font-bold text-slate-700 text-sm md:text-base flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 md:w-5 md:h-5 text-blue-500"></i> ${new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'short'})}</h4>
                                <span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold tracking-wide">${myAtt ? myAtt.status : 'Belum Absen'}</span>
                            </div>
                            
                            <div class="text-center mb-4">
                                <p class="text-xs md:text-sm text-slate-500 font-medium mb-1">${todayShiftName}</p>
                            </div>

                            <div class="flex gap-4 mb-5">
                                <div class="flex-1 bg-slate-50 rounded-2xl p-4 text-center border border-slate-100 relative">
                                    ${myAtt?.photoIn ? `<div class="absolute -top-2 -right-2 w-6 h-6 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow"><i data-lucide="check" class="w-4 h-4"></i></div>` : ''}
                                    <p class="text-slate-500 text-xs font-semibold mb-1">Jam Masuk</p>
                                    <p class="text-2xl md:text-3xl font-black text-slate-800">${myAtt ? myAtt.clockIn : '--:--'}</p>
                                </div>
                                <div class="flex-1 bg-slate-50 rounded-2xl p-4 text-center border border-slate-100 relative">
                                    ${(myAtt?.clockOut && myAtt?.photoOut) ? `<div class="absolute -top-2 -right-2 w-6 h-6 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow"><i data-lucide="check" class="w-4 h-4"></i></div>` : ''}
                                    <p class="text-slate-500 text-xs font-semibold mb-1">Jam Pulang</p>
                                    <p class="text-2xl md:text-3xl font-black text-slate-800">${(myAtt && myAtt.clockOut) ? myAtt.clockOut : '--:--'}</p>
                                </div>
                            </div>

                            <div class="flex gap-3 mt-auto">
                                <!-- Tombol Kamera Absen Hijau -->
                                <button onclick="window.bukaKameraAbsen('in')" class="${myAtt ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-emerald-500 text-white hover:bg-emerald-600 shadow-[0_8px_16px_rgba(16,185,129,0.3)]'} flex-1 font-bold py-3.5 md:py-4 rounded-xl transition-all active:scale-95 flex flex-col items-center justify-center gap-1" ${myAtt ? 'disabled' : ''}>
                                    <i data-lucide="scan-face" class="w-6 h-6 md:w-7 md:h-7"></i>
                                    <span class="text-[11px] md:text-xs uppercase tracking-wider">Absen Masuk</span>
                                </button>
                                <!-- Tombol Kamera Absen Merah -->
                                <button onclick="window.bukaKameraAbsen('out')" class="${(!myAtt || myAtt.clockOut) ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-rose-500 text-white hover:bg-rose-600 shadow-[0_8px_16px_rgba(244,63,94,0.3)]'} flex-1 font-bold py-3.5 md:py-4 rounded-xl transition-all active:scale-95 flex flex-col items-center justify-center gap-1" ${(!myAtt || myAtt.clockOut) ? 'disabled' : ''}>
                                    <i data-lucide="scan-face" class="w-6 h-6 md:w-7 md:h-7"></i>
                                    <span class="text-[11px] md:text-xs uppercase tracking-wider">Absen Pulang</span>
                                </button>
                            </div>
                        </div>

                        <!-- Kolom Kanan: Grafik & Rekap (Desktop: 7 kolom) -->
                        <div class="md:col-span-7 flex flex-col gap-6">
                            <!-- Grafik Kehadiran Karyawan -->
                            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 flex-1 flex flex-col justify-center">
                                <div class="flex justify-between items-center mb-5">
                                    <div>
                                        <h3 class="font-bold text-slate-800 text-sm md:text-base">Grafik Kehadiran</h3>
                                        <p class="text-[10px] md:text-xs text-slate-400">7 Hari Terakhir</p>
                                    </div>
                                    <div class="flex items-center gap-2 text-[10px] md:text-xs font-semibold text-slate-500">
                                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Hadir</span>
                                    </div>
                                </div>
                                <div class="flex items-end justify-between h-32 md:h-40 gap-3 pt-2">
                                    ${chartHtml}
                                </div>
                            </div>

                            <!-- Rekap Bulan Ini -->
                            <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 flex justify-between items-center">
                                <div>
                                    <h3 class="font-bold text-slate-800 text-sm md:text-base mb-1">Total Kehadiran Bulan Ini</h3>
                                    <p class="text-xs md:text-sm text-slate-500 font-medium">Hadir: <span class="text-emerald-500 font-bold">${countHadir} Hari</span></p>
                                </div>
                                <div class="text-right">
                                    <h3 class="font-bold text-slate-800 text-sm md:text-base mb-1">Total Lembur</h3>
                                    <span class="text-xs md:text-sm text-amber-600 font-bold bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-200 block">${otHours} Jam ${otMins} Menit</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        window.bukaKameraAbsen = function(type) {
            const user = window.appState.currentUser;
            const dateStr = new Date().toISOString().split('T')[0];
            let existingAtt = window.appState.attendances.find(a => a.empId === user.id && a.date === dateStr);
            
            if (type === 'in' && existingAtt) return window.showToast('Anda sudah absen masuk hari ini!', 'error');
            if (type === 'out' && (!existingAtt || existingAtt.clockOut)) return window.showToast('Anda belum absen masuk atau sudah absen pulang!', 'error');

            let modal = document.createElement('div');
            modal.id = 'camera-modal';
            modal.className = 'fixed inset-0 bg-black z-[90] flex flex-col items-center justify-center fade-in';
            
            // Warna aksen berdasarkan tipe absen
            let accentColor = type === 'in' ? 'emerald' : 'rose';
            
            modal.innerHTML = `
                <div class="relative w-full max-w-md h-full flex flex-col">

        window.ambilFotoAbsen = function(type, color) {
            let video = document.getElementById('kamera-video');
            let canvas = document.getElementById('kamera-canvas');
            let status = document.getElementById('kamera-status');
            let btnCapture = document.getElementById('btn-capture');
            
            status.innerHTML = `<span class="flex items-center gap-2"><i data-lucide="scan-face" class="w-4 h-4"></i> Menganalisa Wajah...</span>`;
            status.className = "text-amber-400 text-sm font-bold animate-pulse bg-amber-900/40 px-4 py-1.5 rounded-full border border-amber-500/30";
            btnCapture.disabled = true;
            btnCapture.classList.add('opacity-50');
            lucide.createIcons();

            canvas.width = 300; canvas.height = 300; 
            let ctx = canvas.getContext('2d');
            let minDim = Math.min(video.videoWidth, video.videoHeight);
            let startX = (video.videoWidth - minDim) / 2;
            let startY = (video.videoHeight - minDim) / 2;
            
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, startX, startY, minDim, minDim, 0, 0, canvas.width, canvas.height);
            let photoData = canvas.toDataURL('image/jpeg', 0.5); 

            setTimeout(() => {
                status.innerHTML = `<span class="flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Wajah Terverifikasi!</span>`;
                status.className = `text-${color}-400 text-sm font-bold bg-${color}-900/40 px-4 py-1.5 rounded-full border border-${color}-500/30`;
                lucide.createIcons();
                
                setTimeout(() => {
                    window.tutupKamera();
                    window.prosesAbsen(type, photoData);
                }, 800);
            }, 1500); 
        };

        window.prosesAbsen = function(type, photoData) {
            const user = window.appState.currentUser;
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            let existingAtt = window.appState.attendances.find(a => a.empId === user.id && a.date === dateStr);

            if (type === 'in') {
                let newAtt = {
                    id: 'ATT_' + Date.now(),
                    empId: user.id, date: dateStr, clockIn: timeStr, clockOut: null, status: 'Hadir', 
                    photoIn: photoData, photoOut: null, isDeleted: false
                };
                window.appState.attendances.push(newAtt);
                window.showToast(`Berhasil Absen Masuk: ${timeStr}`);
                
            } else if (type === 'out') {
                existingAtt.clockOut = timeStr;
                existingAtt.photoOut = photoData;
                
                // SISTEM LEMBUR OTOMATIS
                let mySchedule = window.appState.schedules.find(s => s.empId === user.id && s.date === dateStr);
                let shiftEndTimeStr = "17:00"; // Default
                
                if(mySchedule) {
                    let shiftData = window.appState.shifts.find(sh => sh.id === mySchedule.shiftId);
                    if(shiftData) shiftEndTimeStr = shiftData.endTime;
                }
                
                let timePulang = new Date(`${dateStr}T${timeStr}:00`);
                let timeBatas = new Date(`${dateStr}T${shiftEndTimeStr}:00`);
                
                if(timePulang > timeBatas) {
                    let diffMs = timePulang - timeBatas;
                    let diffMins = Math.floor(diffMs / 60000);
                    
                    if(diffMins > 15) { // Toleransi 15 menit
                        window.appState.overtimes.push({
                            id: 'OVT_' + Date.now(),
                            empId: user.id, date: dateStr, minutes: diffMins, status: 'Auto'
                        });
                        window.showToast(`Absen Pulang berhasil. Lembur otomatis tercatat: ${diffMins} menit!`, 'success');
                    } else {
                        window.showToast(`Berhasil Absen Pulang: ${timeStr}`);
                    }
                } else {
                    window.showToast(`Berhasil Absen Pulang: ${timeStr}`);
                }
            }

            saveState(); pushDataToServer(); window.renderApp();
        };

        window.simpanJadwalRentang = function(btn) {
            let empId = document.getElementById('jadwal-emp').value;
            let shiftId = document.getElementById('jadwal-shift').value;
            let start = document.getElementById('jadwal-start').value;
            let end = document.getElementById('jadwal-end').value;

            if(!empId || !shiftId || !start || !end) return window.showToast('Lengkapi semua data!', 'error');

            let startDate = new Date(start);
            let endDate = new Date(end);
            
            if(startDate > endDate) return window.showToast('Tanggal akhir tidak boleh lebih awal!', 'error');

            let loop = new Date(startDate);
            while(loop <= endDate) {
                let dateStr = loop.toISOString().split('T')[0];
                
                // Jika jadwal di tanggal itu sudah ada, update shift-nya, jika belum, buat baru
                let exist = window.appState.schedules.find(s => s.empId === empId && s.date === dateStr);
                if(exist) {
                    exist.shiftId = shiftId;
                } else {
                    window.appState.schedules.push({ id: 'SCH_' + Date.now() + Math.floor(Math.random()*1000), empId: empId, date: dateStr, shiftId: shiftId });
                }
                
                let newDate = loop.setDate(loop.getDate() + 1);
                loop = new Date(newDate);
            }

            saveState(); pushDataToServer();
            btn.closest('.fixed').remove();
            window.showToast('Jadwal berhasil diterapkan!', 'success');
        };

        window.tampilkanSlipCetak = function(empId, totalHadir, otHours) {

            // Kalkulasi Akhir
            let uangLembur = otHours * tarifLembur;
            let totalKotor = gp + uangLembur;

            document.getElementById('modal-form-gaji').remove();

                            <p class="text-xs text-slate-500">Nama <span class="font-bold text-slate-800 ml-4">: ${emp.name}</span></p>
                            <p class="text-xs text-slate-500">Jabatan <span class="font-bold text-slate-800 ml-1">: ${emp.position}</span></p>
                            <p class="text-xs text-slate-500">Periode <span class="font-bold text-slate-800 ml-2">: ${monthName}</span></p>
                        </div>

                        <div class="space-y-3 mb-4 relative z-10">
                            <p class="text-[10px] font-bold text-slate-400 uppercase border-b border-slate-100 pb-1">Pendapatan</p>
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-slate-600 font-medium">Gaji Pokok (${totalHadir} Hari)</span>
                                <span class="font-bold text-slate-800">${formatter.format(gp)}</span>
                            </div>
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-slate-600 font-medium">Lembur (${otHours} Jam)</span>
                                <span class="font-bold text-slate-800">${formatter.format(uangLembur)}</span>
                            </div>
                            
                            ${totalPotongan > 0 ? `
                            <p class="text-[10px] font-bold text-rose-400 uppercase border-b border-rose-100 pb-1 mt-4">Potongan</p>
                            ${potIzin > 0 ? `
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-rose-600 font-medium">Izin/Sakit</span>
                                <span class="font-bold text-rose-600">- ${formatter.format(potIzin)}</span>
                            </div>` : ''}
                            ${potKasbon > 0 ? `
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-rose-600 font-medium">Kasbon</span>

                        </div>
                        
                        <div class="mt-8 text-center relative z-10">
                            <p class="text-[9px] text-slate-400 italic">Dicetak oleh sistem AbsensiQue pada ${today.toLocaleDateString('id-ID')} - ${today.toLocaleTimeString('id-ID')}</p>

                    </div>

                                    <span class="inline-flex items-center gap-1"><i data-lucide="arrow-left-circle" class="w-3 h-3 text-rose-500"></i> ${a.clockOut || '--:--'}</span>
                                </p>
                                ${ovt ? `<span class="text-[10px] md:text-xs font-bold text-amber-500 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-100">Lembur: ${ovt.minutes}m</span>` : (user.role === 'admin' ? `<p class="text-[10px] md:text-xs text-slate-400 font-medium">${a.date}</p>` : '')}

            let pin = document.getElementById('add-emp-pin').value.trim();

                        </div>
                        <div class="md:col-span-2 space-y-3">
                            <button onclick="window.bukaGantiPin()" class="w-full bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-100 flex items-center gap-3 hover:bg-slate-50 transition text-slate-700">
                                <i data-lucide="key" class="w-5 h-5 md:w-6 md:h-6 text-amber-500"></i><span class="font-bold text-sm md:text-base">Ganti PIN Masuk</span>
                            </button>
                            <button onclick="window.logoutApp()" class="w-full bg-rose-50 p-4 md:p-5 rounded-xl shadow-sm border border-rose-100 flex items-center gap-3 hover:bg-rose-100 transition text-rose-600">
                                <i data-lucide="log-out" class="w-5 h-5 md:w-6 md:h-6"></i><span class="font-bold text-sm md:text-base">Keluar (Log Out)</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.bukaGantiPin = function() {
            let modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-900/60 z-[90] flex justify-center items-center fade-in backdrop-blur-sm p-4';
            modal.innerHTML = `
                <div class="bg-white w-full max-w-sm rounded-[2rem] p-6 shadow-2xl relative slide-up">
                    <h3 class="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2"><i data-lucide="key" class="w-5 h-5 text-amber-500"></i> Ganti PIN / Password</h3>
                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="text-xs font-semibold text-slate-500 block mb-1">PIN / Password Lama</label>
                            <input type="password" id="pin-lama" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none tracking-widest text-center">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-500 block mb-1">PIN / Password Baru</label>
                            <input type="password" id="pin-baru" class="w-full border rounded-xl p-3 text-sm bg-slate-50 outline-none tracking-widest text-center">
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="this.closest('.fixed').remove()" class="flex-1 bg-slate-100 text-slate-600 font-bold py-3.5 rounded-xl hover:bg-slate-200 text-sm">Batal</button>
                        <button onclick="window.simpanGantiPin(this)" class="flex-1 bg-amber-500 text-white font-bold py-3.5 rounded-xl hover:bg-amber-600 text-sm">Update PIN</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons();
        };

        window.simpanGantiPin = function(btn) {
            let lama = document.getElementById('pin-lama').value;
            let baru = document.getElementById('pin-baru').value;
            let user = window.appState.currentUser;
            
            if(lama !== user.password) return window.showToast('PIN Lama Anda salah!', 'error');
            if(baru.length < 3) return window.showToast('PIN Baru terlalu pendek!', 'error');
            
            let emp = window.appState.employees.find(e => e.id === user.id);
            if(emp) {
                emp.password = baru;
                window.appState.currentUser.password = baru; // Perbarui sesi yang sedang aktif
                saveState(); pushDataToServer();
                btn.closest('.fixed').remove();
                window.showToast('PIN / Password berhasil diubah!', 'success');
            }
        };

        function renderBottomNav(container) {
            const nav = document.createElement('div');
            nav.className = 'fixed bottom-0 w-full md:max-w-5xl lg:max-w-7xl bg-white border-t border-slate-100 flex justify-around md:justify-center md:gap-24 px-6 py-3 md:py-4 md:rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-50 pb-5 md:pb-4 no-print'; 
            
            const menus = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Beranda' },
                { id: 'rekap', icon: 'file-spreadsheet', label: 'Rekap' },
                { id: 'karyawan', icon: 'users', label: 'Tim' },
                { id: 'akun', icon: 'user-circle', label: 'Akun' }
            ];

            menus.forEach(m => {
                const isActive = currentTab === m.id;
                nav.innerHTML += `
                    <button onclick="window.navigate('${m.id}')" class="flex flex-col items-center gap-1 min-w-[60px] transition-all duration-300 ${isActive ? 'text-blue-600 transform -translate-y-1' : 'text-slate-400 hover:text-slate-600'}">
                        <div class="relative p-1.5 ${isActive ? 'bg-blue-50 rounded-xl' : ''}">
                            <i data-lucide="${m.icon}" class="w-6 h-6 ${isActive ? 'fill-blue-100 stroke-[2.5px]' : 'stroke-2'}"></i>
                        </div>
                        <span class="text-[10px] font-bold tracking-wide">${m.label}</span>
                    </button>
                `;
            });
            container.appendChild(nav);
        }

        function initApp() {
            loadState();
            window.renderApp();
            syncData(); 
            setInterval(() => { if(window.appState.currentUser) syncData(); }, 30000);
        }

        window.onload = function() {
            if(window.lucide) lucide.createIcons();
            initApp();
        };
    </script>
</body>
</html>
